name: Discz
description: 'Discz is a consumer mobile application that blends music discovery with social
  chat, styled as a modern, MySpace-inspired music community. Users discover songs, build music
  profiles, and chat with others around shared taste in music. The iOS app is developed by Discz,
  a Y Combinator-backed startup and a portfolio company of DCM Ventures. Discz publishes no public
  developer API, SDK, or developer portal; its surface is the consumer iOS app distributed through
  the Apple App Store.'
